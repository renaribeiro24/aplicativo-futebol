name: Controlled foundation checks
on:
  push:
    branches:
      - feat/stage0042-operational
      - feat/members-foundation
      - feat/members-management
permissions:
  contents: read
jobs:
  isolated:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Database-first isolated review
        run: npm run db:test
      - name: Dependency inventory
        if: always()
        run: |
          npm audit --json > /tmp/member-audit.json || true
          npm audit --omit=dev --json > /tmp/member-audit-production.json || true
          node -e 'for(const file of ["/tmp/member-audit.json","/tmp/member-audit-production.json"]){const a=require(file);console.log("MEMBER_AUDIT "+JSON.stringify({file,metadata:a.metadata,vulnerabilities:a.vulnerabilities}));}'
      - name: Inspect reviewed source formatting
        run: |
          node --input-type=module <<'JS'
          import fs from "node:fs";
          import prettier from "prettier";
          const files = ["src/features/groups/access.ts","src/features/groups/server.ts","src/app/(protected)/dashboard/page.tsx","tests/group-settings-guard.test.ts","tests/member-access.test.ts","scripts/test-database.mjs","docs/MEMBERS-A.md",".github/workflows/controlled-foundation.yml"];
          for (const path of files) {
            const original = fs.readFileSync(path, "utf8");
            const config = await prettier.resolveConfig(path);
            const content = await prettier.format(original, { ...config, filepath: path });
            if (original !== content) { console.log("REVIEWED_FORMAT " + JSON.stringify({ path, content })); process.exitCode = 1; }
          }
          JS
      - run: npm run format:check
        continue-on-error: true
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run db:test
      - name: Install isolated browser tools
        run: |
          npm install --prefix "$RUNNER_TEMP/ui-tools" --no-save --package-lock=false playwright@1.62.1
          "$RUNNER_TEMP/ui-tools/node_modules/.bin/playwright" install --with-deps chromium
      - name: Desktop and mobile, light and dark
        run: node scripts/test-location-visual.mjs
        env:
          LOCATION_PLAYWRIGHT_MODULE: ${{ runner.temp }}/ui-tools/node_modules/playwright
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: isolated-location-ui
          path: work/location-ui/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: isolated-member-foundation
          path: work/member-foundation/
          if-no-files-found: ignore
